name: Build Pull Request
on:
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Run Checkstyle
        run: ./gradlew --build-cache --parallel checkstyleMain
      - name: Upload Checkstyle results
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-results
          path: build/reports/checkstyle/
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Assemble Jar
        run: ./gradlew --build-cache --parallel assemble
